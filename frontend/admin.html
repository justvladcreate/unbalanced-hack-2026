<!DOCTYPE html>
<html lang="en">
<head>

    <style>

            width: 65px;

            outline: none;

        }
        .knopka4 {
            border-radius: 50px;

            margin-left: 5px;

        }

</head>
<body>
    <div class="cont1">
        <button class="knopka1" onclick="location.href='domik_admin.html'">

        <button class="knopka4" onclick="location.href='register.html'">
