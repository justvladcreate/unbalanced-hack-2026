<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ujin - Вход</title>
</head>
<body>
    <h1>Добро пожаловать</h1>
    
    <div id="login-form">
        <h2>Вход в систему</h2>
        <input type="text" id="login" placeholder="Логин"><br><br>
        <input type="password" id="password" placeholder="Пароль"><br><br>
        <button id="login-btn">Войти</button>
    </div>

    <div id="dashboard" style="display: none;">
        <h2>Ваши устройства <span id="role-label"></span></h2>
        
        <ul id="devices-list"></ul>
        
        <div id="admin-block" style="display: none; border: 1px solid #ccc; padding: 10px; margin-top: 20px;">
            <h3>Добавить устройство</h3>
            <input type="text" id="new-dev-name" placeholder="Название"><br><br>
            <input type="text" id="new-dev-type" placeholder="Тип (например, leak)"><br><br>
            <button id="add-device-btn">Добавить</button>
        </div>

        <div id="user-block" style="display: none; border: 1px solid #ccc; padding: 10px; margin-top: 20px;">
            <h3>Связь с УК</h3>
            <input type="text" id="request-text" placeholder="Текст запроса"><br><br>
            <button id="send-request-btn">Отправить</button>
        </div>

        <br>
        <button id="logout-btn">Выйти</button>
    </div>

    <br>
    <a href="/tests" class="btn">Перейти к запуску тестов</a>

    <script src="script.js"></script>
</body>
</html>
