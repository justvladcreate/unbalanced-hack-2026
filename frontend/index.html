<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ujin Мокап</title>
</head>
<body>
    <h1>Система Умный Дом</h1>
    
    <div id="auth-block">
        <h2>Вход</h2>
        <input type="text" id="login" placeholder="Логин"><br><br>
        <input type="password" id="password" placeholder="Пароль"><br><br>
        <button onclick="doLogin()">Войти</button>
        <button onclick="showReg()">Регистрация</button>
    </div>

    <div id="reg-block" style="display: none;">
        <h2>Регистрация</h2>
        <input type="text" id="reg-login" placeholder="Новый логин"><br><br>
        <input type="password" id="reg-pass" placeholder="Новый пароль"><br><br>
        <button onclick="doRegister()">Зарегистрироваться</button>
        <button onclick="hideReg()">Назад</button>
    </div>

    <div id="main-screen" style="display: none;">
        <h2>Главная <span id="role-text"></span></h2>
        <button onclick="logout()">Выйти</button>
        
        <div id="admin-panel" style="display: none;">
            <h3>Управление устройствами</h3>
            <input type="text" id="dev-name" placeholder="Имя устройства">
            <input type="text" id="dev-type" placeholder="Тип">
            <button onclick="addDevice()">Добавить устройство</button>
            
            <h3>Редактор сценариев</h3>
            <input type="text" id="scen-name" placeholder="Название сценария">
            <button onclick="addScenario()">Добавить сценарий</button>
            <button onclick="givePermission()">Дать разрешение жильцу</button>
        </div>

        <div id="user-panel" style="display: none;">
            <h3>Связь с УК</h3>
            <input type="text" id="req-text" placeholder="Что случилось?">
            <button onclick="sendRequest()">Отправить запрос</button>
        </div>

        <h3>Мои устройства</h3>
        <ul id="device-list"></ul>

        <h3>Мои сценарии</h3>
        <ul id="scenario-list"></ul>

        <h3>Уведомления</h3>
        <ul id="notif-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
