<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мульти инструмент для управления домом!</title>
    <style>
        body {
            background-color: whitesmoke;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 30px 20px;
        }
        .cont1 {
            max-width: 75px;
            height: fit-content;
            overflow-x: hidden;
            background-color: gray;
            border-radius: 50px;
            margin: 0px;
            margin-top: 30px;
            padding: 15px 15px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);


        }
        .concont1, .concont2, .concont3, .concont4 {
            height: 65px;
            width: 65px;
            border-radius: 50px;
            background-color: white;
            margin: 5px;
            flex-shrink: 0;
        }
        .domik {
            font-size: 50px;
            margin-left: 1px;
        }
        .tri_poloski {
            font-size: 40px;
            margin-left: 1px;
        }
        .datchik {
            font-size: 40px;
            margin-left: 1px;
        }
        .plus_datchik {
            font-size: 50px;
        }
        .knopka1 {
            border-radius: 50px;
            height: 65px;
            width: 65px;
            border: none;
            background-color: transparent;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 5px;
        }
        .knopka2 {
            border-radius: 50px;
            height: 65px;
            width: 65px;
            border: none;
            background-color: transparent;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 5px;
            margin-top: 5px;
        }
        .knopka3 {
            border-radius: 50px;
            height: 65px;
            width: 65px;
            border: none;
            background-color: transparent;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 5px;
            margin-top: 5px;
        }
        .knopka4 {
            border-radius: 50px;
            height: 65px;
            width: 65px;
            border: none;
            background-color: transparent;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 5px;
            margin-top: 5px;
        }
        .name_dt {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px;
            border-radius: 999px;
            padding: 8px 8px 8px 40px;
            transition: border-color 0.2s;
        }
        .name_dt input {
            flex: 1;
            outline: none;
            background: transparent;
            padding: 20px;
            font-size: 40px;
            border-radius: 999px;
            margin: 15px;
            margin-left: 320px;
        }
        .type_dt {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px;
            border-radius: 50px;
            padding: 4px 4px 4px 20px;
            transition: border-color 0.2s;
        }
        .type_dt input {
            outline: none;
            background: transparent;
            padding: 20px;
            font-size: 20px;
            border-radius: 50px;
            margin: 10px;
            margin-left: 455px;
        }
        .nttfj {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px;
            border-radius: 50px;
            padding: 4px 4px 4px 20px;
            transition: border-color 0.2s;
        }
        .nttfj input {
            outline: none;
            background: transparent;
            padding: 20px;
            font-size: 10px;
            border-radius: 50px;
            margin: 10px;
            margin-left: 525px;
        }
        .dt_cr {
            width: 120px;
            height: 50px;
            border-radius: 50px;
            font-size: 15px;
            cursor: pointer;
            background-color: gray;
            margin-left: 575px;
            display: flex;
            justify-content: center;
            align-items: center;
        }



    </style>


</head>
<body>
    <div class="cont1">
        <button class="knopka1" onclick="location.href='domik.html'">
            <div class="concont1">
                <div class="domik">⌂</div>
            </div>
        </button>
        <button class="knopka2" onclick="location.href='datchik.html'">
            <div class="concont2">
                <div class="datchik">🌡</div>
            </div>
        </button>
        <button class="knopka3" onclick="location.href='plus_datchik.html'">
            <div class="concont3">
                <div class="plus_datchik">+</div>
            </div>
        </button>
        <button class="knopka4" onclick="location.href='register.html'">
            <div class="concont4">
                <div class="tri_poloski">☰</div>
            </div>
        </button>
    </div>
    <div class="nttf">
        <div class="name_dt">
            <label for="name"></label>
            <input type="text" id="name" name="name" placeholder="Имя датчика">
        </div>
        <div class="type_dt">
            <label for="type"></label>
            <input type="text" id="type" name="type" placeholder="Тип датчика">
        </div>
        <div class="nttfj">
            <label for="ed"></label>
            <input type="text" id="ed" name="ed" placeholder="Ед. измерения">
        </div>
        <div class="q12314">
            <button class="dt_cr">Добавить датчик
            </button>
        </div>
        
    </div>
    <script src="add_device.js"></script>
</body>
</html>
