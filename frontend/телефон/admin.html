<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мульти инструмент для управления домом!</title>
    <style>
        body {
            background-color: whitesmoke;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 30px 20px;
        }
        .cont1 {
            max-width: 75px;
            max-height: 630px;
            overflow-x: auto;
            background-color: gray;
            border-radius: 50px;
            margin: 0px;
            margin-top: 30px;
            padding: 15px 15px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);


        }
        .concont1, .concont4 {
            height: 65px;
            width: 65px;
            border-radius: 50px;
            background-color: white;
            margin: 5px;
            flex-shrink: 0;
        }
        .domik {
            font-size: 50px;
            margin-left: 1px;
        }
        .tri_poloski {
            font-size: 40px;
            margin-left: 1px;
        }
        .datchik {
            font-size: 40px;
            margin-left: 1px;
        }
        .plus_datchik {
            font-size: 50px;
        }
        .knopka1 {
            border-radius: 50px;
            height: 65px;
            width: 65px;
            border: none;
            background-color: transparent;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 5px;
        }
        .knopka4 {
            border-radius: 50px;
            height: 65px;
            width: 65px;
            border: none;
            background-color: transparent;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 5px;
            margin-top: 5px;
        }
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                padding: 10px;
                gap: 15px;
                align-items: center;
            }
            .cont1 {
                max-width: 100%;
                max-height: none;
                margin-top: 0;
                display: flex;
                flex-direction: row;
                padding: 5px 15px;
                align-self: center;
            }
            .knopka4 {
                margin-top: 0;
            }
            .cont2 {
                width: 100%;
                max-width: 450px;
                height: auto;
                padding-bottom: 20px;
                flex-shrink: 1;
            }
            .conti3 {
                margin-left: auto;
                margin-right: auto;
                width: 90%;
                max-width: 390px;
            }
            .cont4helper div[class] { 
                width: 95%;
                margin: 10px auto 0 auto;
            }
        }

    </style>


</head>
<body>
    <div class="cont1">
        <button class="knopka1" onclick="location.href='domik_admin.html'">
            <div class="concont1">
                <div class="domik">⌂</div>
            </div>
        </button>
        <button class="knopka4" onclick="location.href='register.html'">
            <div class="concont4">
                <div class="tri_poloski">☰</div>
            </div>
        </button>
    </div>
</body>
</html>
